name: CI
env:
  NEXT_PUBLIC_API_URL: http://localhost:4000
  NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
  NEXT_PUBLIC_REALTIME_URL: http://localhost:4000
on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: release-test-only
          POSTGRES_DB: release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Release PostgreSQL regression and migration rehearsal
        run: pnpm --filter api test:release
        env:
          RELEASE_TEST_DATABASE_URL: postgresql://postgres:release-test-only@127.0.0.1:5432/release_test

      - name: Build
        run: pnpm build

      - name: Production API HTTP and WebSocket regression
        run: pnpm --filter api test:runtime
        env:
          RELEASE_TEST_DATABASE_URL: postgresql://postgres:release-test-only@127.0.0.1:5432/release_test
